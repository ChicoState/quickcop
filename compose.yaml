services:
  postgres:
    image: postgres:17.2-bookworm
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quickcop_dev}
      POSTGRES_USER: ${POSTGRES_USER:-quickcop_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [quickcop]

networks:
  quickcop:
    driver: bridge

volumes:
  postgres-data:
